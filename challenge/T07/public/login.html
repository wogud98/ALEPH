<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 플랜두씨 다이어리</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script src="/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="wrap auth">
    <div class="auth-brand">
      <h1>플랜두씨 다이어리</h1>
      <p class="sub">계획하고, 해 보고, 돌아본다 · 내 기록은 로그인한 나만 봅니다</p>
    </div>

    <section class="sheet auth-card" id="login-box" aria-labelledby="login-h">
      <h2 id="login-h">로그인</h2>
      <form id="login-form" class="form" novalidate>
        <label>아이디 <input name="username" autocomplete="username" required maxlength="30" autocapitalize="none" spellcheck="false"></label>
        <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
        <p class="auth-error" id="login-error" role="alert"></p>
        <button type="submit" class="btn primary">로그인</button>
      </form>
      <p class="hint">계정이 없나요? <a href="/signup" id="to-signup">가입하기</a></p>
    </section>

    <section class="sheet auth-card" id="signup-box" aria-labelledby="signup-h" hidden>
      <h2 id="signup-h">가입</h2>
      <form id="signup-form" class="form" novalidate>
        <label>아이디 <input name="username" autocomplete="username" required maxlength="30" autocapitalize="none" spellcheck="false" pattern="[a-z0-9_]{3,30}">
          <span class="hint">영문 소문자·숫자·밑줄(_) 3~30자</span></label>
        <label>비밀번호 <input name="password" type="password" autocomplete="new-password" required minlength="10">
          <span class="hint">10자 이상. 비밀번호는 서버에 그대로 저장하지 않고 argon2id로 바꿔 저장합니다</span></label>
        <label>비밀번호 확인 <input name="password2" type="password" autocomplete="new-password" required minlength="10"></label>
        <p class="auth-error" id="signup-error" role="alert"></p>
        <button type="submit" class="btn primary">가입하고 시작하기</button>
      </form>
      <p class="hint">이미 계정이 있나요? <a href="/login" id="to-login">로그인</a></p>
    </section>

    <p class="hint fine">
      로그인하면 이 브라우저에 7일 동안 유지되는 쿠키 하나만 저장합니다. 다른 사람의 기록은 서버가 주인을 확인해 보여 주지 않습니다.
      · 소스 <a href="https://github.com/wogud98/ALEPH/tree/main/challenge/T07">github.com/wogud98/ALEPH</a>
    </p>
  </main>
  <noscript><p class="wrap empty">이 화면은 자바스크립트가 켜져 있어야 동작합니다.</p></noscript>
</body>
</html>
