name: T04 환율 수집

on:
  schedule:
    # GitHub cron은 UTC 기준. 정각은 혼잡해서 지연이 잦으므로 17분에 실행.
    - cron: '17 1 * * *'   # 매일 10:17 KST (원천 갱신 이후)
    - cron: '17 13 * * *'  # 매일 22:17 KST (아침 실행이 밀리거나 실패했을 때 대비, 같은 날이면 갱신만 됨)
  workflow_dispatch: {}     # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: t04-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 환율 조회 및 저장
        run: node challenge/T04/collector/collect.js

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add challenge/T04/data
          if git diff --cached --quiet; then
            echo "커밋할 변경 없음"
            exit 0
          fi
          git commit -m "T04 기록: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase
          git push
