<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>명길 기지, 여기는 지훈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--blue:#1F3BFF;--dot:#4A63FF;--yellow:#FFD60A;--ink:#0A0A12;--pink:#FF3B6B;--white:#FFFFFF;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--blue);background-image:radial-gradient(circle,var(--dot) 3px,transparent 3.5px);background-size:28px 28px;color:var(--white);font-family:'Noto Sans KR',sans-serif;min-height:100dvh;overflow-x:hidden}
.wrap{max-width:520px;margin:0 auto;padding:24px 20px 56px;display:flex;flex-direction:column;gap:20px;min-height:100dvh}
.bar{display:flex;justify-content:space-between;align-items:center;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:1px}
.tag{background:var(--yellow);color:var(--ink);border:3px solid var(--ink);padding:3px 10px}
h1{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(46px,15vw,76px);line-height:1;margin:0;letter-spacing:-1px;text-wrap:balance}
.hl{display:inline-block;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:0 14px;transform:rotate(-2deg);margin-top:8px}
.card{background:var(--white);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:16px 18px}
.mono{font-family:'Space Mono',monospace}
.btn{font-family:'Black Han Sans',sans-serif;font-size:26px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);background:var(--yellow);color:var(--ink);padding:12px 22px;cursor:pointer;min-height:56px;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(2px,2px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--white);outline-offset:3px}
.log{display:flex;flex-direction:column;gap:12px}
.msg{background:var(--white);color:var(--ink);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:12px 16px;animation:pop .35s ease-out both}
.msg b{display:block;font-family:'Space Mono',monospace;font-size:13px;color:var(--blue);margin-bottom:2px}
.msg span{font-weight:700;font-size:18px;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--yellow)}
.msg.me b{color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.ask h2{font-family:'Black Han Sans',sans-serif;font-weight:400;font-size:clamp(40px,12vw,60px);line-height:1.05;margin:0 0 16px;text-wrap:balance}
.yes{width:100%;font-size:40px;background:var(--pink);color:var(--white);padding:18px}
.arena{position:relative;height:150px;margin-top:14px}
.no{position:absolute;left:0;top:0;font-size:22px;background:var(--white);transition:left .18s,top .18s}
.say{font-family:'Space Mono',monospace;font-size:14px;min-height:22px;margin-top:6px}
.hidden{display:none}
.heli{position:fixed;left:0;top:16%;width:150px;z-index:5;pointer-events:none;animation:fly 5.5s linear infinite}
@keyframes fly{from{transform:translateX(-170px)}to{transform:translateX(calc(100vw + 20px))}}
.rotor{transform-origin:75px 14px;animation:spin .12s linear infinite}
@keyframes spin{0%{transform:scaleX(1)}50%{transform:scaleX(.15)}100%{transform:scaleX(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
.ticket{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;font-weight:900;font-size:20px}
.ticket small{display:block;font-family:'Space Mono',monospace;font-size:12px;color:#555;font-weight:400}
.fine{font-family:'Space Mono',monospace;font-size:13px;opacity:.95}
@media (prefers-reduced-motion:reduce){.heli,.rotor,.msg{animation:none}.btn,.no{transition:none}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="wrap">
<div class="bar"><span>ARMY AVIATION / 교신</span><span class="tag" id="clock">00:00</span></div>

<section id="s0" style="display:flex;flex-direction:column;gap:22px">
<h1>명길 기지,<br>여기는 <span class="hl">지훈</span></h1>
<div class="card mono" style="font-weight:700;line-height:1.7">
수신 : 명길<br>발신 : 지훈 (육군 항공 헬기 조종사)<br>용건 : 긴급. 오직 명길 님만 응답 가능
</div>
<button class="btn" id="accept" type="button">교신 수락</button>
</section>

<section id="s1" class="hidden">
<div class="log" id="log" aria-live="polite"></div>
<div class="ask hidden" id="ask" style="margin-top:22px">
<h2>나랑 평생<br>착륙할래?</h2>
<button class="btn yes" id="yes" type="button">YES</button>
<div class="arena" id="arena"><button class="btn no" id="no" type="button">NO</button></div>
<div class="say" id="say"></div>
</div>
</section>

<section id="s2" class="hidden" style="display:none;flex-direction:column;gap:22px">
<h1>착륙<br><span class="hl">완료</span></h1>
<div class="msg me"><b>명길 기지</b><span>YES 수신 확인. 지훈 기장, 평생 착륙을 허가한다.</span></div>
<div class="card">
<div class="ticket">
<div><small>FROM</small>지훈</div><div><small>TO</small>명길</div>
<div><small>FLIGHT</small>평생비행</div><div><small>SEAT</small>1A 조종석</div>
</div>
</div>
<div class="fine">※ 이 교신은 취소할 수 없습니다. 환불 불가.</div>
<button class="btn" id="again" type="button" style="background:var(--white)">처음부터 다시 보기</button>
</section>
</main>

<svg class="heli hidden" id="heli" viewBox="0 0 150 70" role="img" aria-label="날아가는 헬기">
<g class="rotor"><rect x="5" y="12" width="140" height="5" fill="#0A0A12"/></g>
<rect x="72" y="16" width="6" height="10" fill="#0A0A12"/>
<ellipse cx="62" cy="38" rx="42" ry="16" fill="#FFD60A" stroke="#0A0A12" stroke-width="4"/>
<ellipse cx="42" cy="34" rx="13" ry="9" fill="#FFFFFF" stroke="#0A0A12" stroke-width="3"/>
<rect x="98" y="34" width="44" height="7" fill="#FFD60A" stroke="#0A0A12" stroke-width="3"/>
<polygon points="136,34 142,18 148,18 146,40" fill="#FF3B6B" stroke="#0A0A12" stroke-width="3"/>
<line x1="30" y1="62" x2="92" y2="62" stroke="#0A0A12" stroke-width="5" stroke-linecap="round"/>
<line x1="44" y1="52" x2="44" y2="62" stroke="#0A0A12" stroke-width="4"/>
<line x1="80" y1="52" x2="80" y2="62" stroke="#0A0A12" stroke-width="4"/>
</svg>

<script>
var LINES=[
["관제탑","명길 기지 응답 바랍니다. 여기는 지훈, 오버."],
["지훈","현재 심장 고도 위험 수준. 반복한다, 위험 수준."],
["지훈","연료는 사랑 100퍼센트. 비상 착륙지는 단 한 곳."],
["지훈","명길 기지에 평생 착륙 허가를 요청한다."]
];
var DODGE=["관제 거부 불가","연료 부족","다시 생각해 봐","고도 낮추는 중","거기 아님","무전 잡음","착륙 지점 변경","잠깐 기다려"];
var $=function(id){return document.getElementById(id)};
var tries=0,reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function tick(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
tick();setInterval(tick,20000);

$('accept').onclick=function(){
$('s0').style.display='none';$('s1').classList.remove('hidden');
LINES.forEach(function(l,i){setTimeout(function(){
var m=document.createElement('div');m.className='msg'+(i>0?' me':'');
m.innerHTML='<b></b><span></span>';m.children[0].textContent=l[0];m.children[1].textContent=l[1];
$('log').appendChild(m);
if(i===LINES.length-1){setTimeout(function(){$('ask').classList.remove('hidden');window.scrollTo({top:document.body.scrollHeight,behavior:reduce?'auto':'smooth'})},900)}
},i*1300)});
};

function dodge(e){
if(e)e.preventDefault();
if(tries>=6){return}
tries++;
var a=$('arena'),b=$('no');
var x=Math.random()*(a.clientWidth-b.offsetWidth);
var y=Math.random()*(a.clientHeight-b.offsetHeight);
b.style.left=Math.max(0,x)+'px';b.style.top=Math.max(0,y)+'px';
$('say').textContent=DODGE[(tries-1)%DODGE.length];
if(tries>=6){b.textContent='...그럼 YES';b.style.left='0px';b.style.top='0px';$('say').textContent='더 이상 도망칠 곳이 없습니다.'}
}
$('no').addEventListener('pointerenter',function(e){if(tries<6)dodge(e)});
$('no').addEventListener('click',function(e){if(tries<6){dodge(e)}else{say()}});
$('yes').onclick=say;

function say(){
$('s1').classList.add('hidden');$('s2').classList.remove('hidden');$('s2').style.display='flex';
$('heli').classList.remove('hidden');window.scrollTo(0,0);confetti();
}
$('again').onclick=function(){location.reload()};

function confetti(){
if(reduce)return;
var c=$('fx'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
var cols=['#FFD60A','#FF3B6B','#FFFFFF','#0A0A12'],p=[],i;
for(i=0;i<160;i++)p.push({x:Math.random()*c.width,y:-Math.random()*c.height*0.6,w:8+Math.random()*8,h:12+Math.random()*10,vy:2+Math.random()*4,vx:-1.5+Math.random()*3,r:Math.random()*6,vr:-.2+Math.random()*.4,c:cols[i%4]});
var t0=performance.now();
(function f(t){
x.clearRect(0,0,c.width,c.height);
p.forEach(function(q){q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.w/2,-q.h/2,q.w,q.h);x.restore()});
if(t-t0<5000)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
})(t0);
}
</script>
</body>
</html>
