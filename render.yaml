# Render Blueprint: T06 플랜두씨 다이어리 (challenge/T06)
# 웹 서비스(Node)와 PostgreSQL을 함께 만든다. DB 접속 주소는 Render가 환경 변수로 직접 넣으므로 저장소에는 비밀값이 없다.
services:
  - type: web
    name: aleph-t06-pds
    runtime: node
    plan: free
    region: singapore
    rootDir: challenge/T06
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: aleph-t06-db
          property: connectionString

databases:
  - name: aleph-t06-db
    plan: free
    region: singapore
    databaseName: pds
    user: pds
